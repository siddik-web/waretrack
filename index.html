<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="WareTrack: a 3D warehouse strategy game you play in the browser.">
<title>WareTrack Logistics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5be0'/%3E%3Cpath d='M32 12 50 22v20L32 52 14 42V22z' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%232f5be0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed isometric yard; frosted HUD cards pinned to the corners; left column = shift goals + incidents; center-top = coach and toasts; phones get a bottom sheet */
:root{
  --ground:#e4eaf2;
  --glass:rgba(255,255,255,.86);
  --glass-solid:#ffffff;
  --line:rgba(28,44,74,.10);
  --ink:#1b2638; --ink-2:#56667f; --ink-3:#8796ab;
  --cobalt:#2f5be0; --cobalt-soft:#e7edfd;
  --safety:#f2c230; --safety-soft:#fdf4d3; --safety-ink:#8a6400;
  --ok:#1f9a63; --ok-soft:#e1f4ea;
  --warn:#c77f0c; --warn-soft:#fcf0d9;
  --bad:#d24b42; --bad-soft:#fbe4e2;
  --flame:#e8642c;
  --mute-soft:#eef1f6;
  --scrim:rgba(24,34,56,.34);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  --shadow:0 1px 2px rgba(20,34,60,.06),0 8px 24px rgba(20,34,60,.08);
  color-scheme:light;
}
[hidden]{display:none!important}
.acts{padding:10px 12px}
.acts-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.acts-h b{font-size:13px;font-family:var(--f-display)}
.seg{margin-left:auto;display:inline-flex;background:var(--mute-soft);border-radius:8px;padding:2px;gap:2px}
.seg button{font-size:10.5px;padding:3px 7px;border-radius:6px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.12)}
.acts-empty{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.act-card{position:relative;display:flex;gap:8px;padding:8px 8px 10px;border-radius:10px;background:var(--mute-soft);margin-top:6px;overflow:hidden}
.act-card.new{animation:slidein .25s ease-out}
.act-card.bad{background:var(--bad-soft)}.act-card.warn{background:var(--warn-soft)}.act-card.info{background:var(--cobalt-soft)}
.ac-ic{flex:none;width:26px;height:26px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--cobalt)}.ac-ic svg{width:15px;height:15px}
.ac-t{flex:1;min-width:0}.ac-t b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ac-t small{display:block;font-size:11px;color:var(--ink-2);line-height:1.35}
.ac-b{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.ac-b .act{padding:3px 9px;font-size:11px}
.ac-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--cobalt);transition:width .4s linear}
.act-card.bad .ac-bar{background:var(--bad)}.act-card.warn .ac-bar{background:var(--warn)}
.acts-more{font-size:11px;color:var(--ink-3);margin-top:6px;text-align:center}
.leftcol{max-height:calc(100vh - 330px);overflow-y:auto;scrollbar-width:none}
@media (max-width:760px){.leftcol{max-height:calc(100vh - 260px)}.act-card{padding:6px 6px 8px}.ac-t small{font-size:10.5px}}
.missions{padding:10px 12px}
.ms-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}.ms-h b{font-size:13px;font-family:var(--f-display)}
.ms-chest{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);font-weight:700}.ms-chest svg{width:12px;height:12px}
.ms{padding:6px 0;border-top:1px solid var(--line)}.ms:first-of-type{border-top:0}
.ms-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}.ms-t span{flex:1}.ms-t small{color:var(--ink-3)}
.ms-t .act{padding:3px 9px;font-size:11px}
.ms .meter{margin-top:4px}.ms-r{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.ms.done .ms-t span{color:var(--safety-ink)}
@keyframes mspulse{0%,100%{box-shadow:0 0 0 0 rgba(242,194,48,.0)}50%{box-shadow:0 0 0 4px rgba(242,194,48,.35)}}
.ms.done .act{animation:mspulse 1.4s ease-in-out infinite}
.welcome{flex-direction:column;align-items:flex-start;gap:2px}.welcome b{font-size:14px}
@media (max-width:760px){.missions{padding:7px 10px}.ms-r{display:none}.ms{padding:4px 0}.ms-t{font-size:11px}}
.trkmode{margin-left:auto;display:inline-flex;background:var(--mute-soft);border-radius:8px;padding:2px;gap:2px}
.trkmode button{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:700;color:var(--ink-3)}
.trkmode button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.12)}
.th .mono+.trkmode{margin-left:10px}
.delhead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 4px}
.delhead .mini b{font-size:15px}
.delnote{font-size:11.5px;color:var(--ink-2);margin:6px 2px 8px;line-height:1.45}
.rstars{letter-spacing:-1px;color:#d4dae4;font-size:12px}.rstars .on{color:#f2b51e}
.badge svg{width:14px;height:14px}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:13px;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
#stage canvas.hover{cursor:pointer}
.hud{position:fixed;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.spot{outline:3px solid var(--cobalt)!important;outline-offset:3px;animation:spot 1.3s infinite}
@keyframes spot{50%{outline-color:rgba(47,91,224,.3)}}

/* top bar */
.bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 8px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;padding:4px 8px;border-radius:10px}
.brand:hover{background:var(--mute-soft)}
.brand svg{width:22px;height:22px}
.brand .chev{width:12px;height:12px;color:var(--ink-3)}
.search{flex:1;max-width:280px;display:flex;align-items:center;gap:8px;background:var(--mute-soft);border-radius:10px;padding:0 10px;height:34px;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.search kbd{font-family:var(--f-mono);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--glass-solid)}
.spacer{flex:1}
.site{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:10px;background:var(--glass-solid);white-space:nowrap;text-align:left}
.site .code{background:var(--cobalt);color:#fff;font-family:var(--f-mono);font-size:10px;font-weight:700;border-radius:6px;padding:4px 6px}
.site b{display:block;font-size:12px}
.site small{display:block;color:var(--ink-3);font-size:10.5px}
.clock{position:relative;display:flex;align-items:center;gap:7px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:5px 11px;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden}
.clock .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
.clock.paused{background:var(--warn-soft);color:var(--warn)}
.clock.paused .dot{animation:none}
.clock b{font-family:var(--f-mono);font-weight:700}
.clock .left{font-weight:500;opacity:.8}
.clock .prog{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.5}
@keyframes blink{50%{opacity:.25}}
.lvl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--glass-solid);border-radius:10px;padding:4px 8px 4px 4px;white-space:nowrap}
.lvl .n{width:24px;height:24px;border-radius:7px;background:var(--safety);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:12px}
.lvl .xp{width:46px;height:4px;border-radius:4px;background:var(--mute-soft);overflow:hidden}
.lvl .xp i{display:block;height:100%;background:var(--safety)}
.combo{display:flex;align-items:center;gap:6px;background:var(--safety-soft);color:var(--safety-ink);border-radius:10px;padding:6px 10px;font-weight:800;white-space:nowrap;font-family:var(--f-display);font-size:14px}
.combo small{font-family:var(--f-body);font-weight:700;font-size:10.5px;opacity:.8}
.combo .pips{display:flex;gap:2px}
.combo .pips i{width:5px;height:12px;border-radius:2px;background:rgba(138,100,0,.2)}
.combo .pips i.on{background:var(--safety-ink)}
.combo.pulse{animation:cpulse .35s}
@keyframes cpulse{40%{transform:scale(1.12)}}
.score{display:flex;align-items:baseline;gap:6px;background:var(--ink);color:#fff;border-radius:10px;padding:6px 12px;white-space:nowrap;transition:transform .15s}
.score label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.score b{font-family:var(--f-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;line-height:1}
.score.bump{transform:scale(1.08)}
.score.free b{font-size:13px;font-family:var(--f-body)}
.speed{display:flex;background:var(--mute-soft);border-radius:10px;padding:3px;gap:2px}
.speed button{height:28px;min-width:34px;padding:0 8px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);font-weight:700;font-size:12px}
.speed button svg{width:13px;height:13px}
.speed button[aria-pressed="true"]{background:var(--glass-solid);color:var(--cobalt);box-shadow:0 1px 3px rgba(20,34,60,.12)}
.ibtn{height:34px;min-width:34px;padding:0 9px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);background:var(--mute-soft);font-weight:700;font-size:12px;white-space:nowrap}
.ibtn svg{width:16px;height:16px}
.ibtn:hover{color:var(--ink)}
.ibtn[aria-pressed="true"]{background:var(--safety);color:var(--ink)}
.call{height:34px;padding:0 12px;border-radius:10px;background:var(--cobalt);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.call svg{width:15px;height:15px}
.call:hover{filter:brightness(1.08)}

/* KPIs */
.kpis{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);left:16px;display:flex;gap:10px;pointer-events:none}
.kpi{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;min-width:150px}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cobalt-soft);color:var(--cobalt);flex:none}
.kpi .ic svg{width:18px;height:18px}
.kpi label{display:block;font-size:11px;color:var(--ink-2);font-weight:600}
.kpi .v{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .d{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--ok)}
.kpi .d.down{color:var(--bad)}
.kpi small{display:block;font-size:10.5px;color:var(--ink-3)}
.meter{height:4px;border-radius:4px;background:var(--mute-soft);overflow:hidden;margin-top:4px;width:100%}
.meter i{display:block;height:100%;background:var(--cobalt);border-radius:inherit;transition:width .4s}
.meter.ok i{background:var(--ok)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)} .meter.gold i{background:var(--safety)}

/* left column */
.leftcol{position:absolute;top:calc(env(safe-area-inset-top,0px) + 150px);left:16px;width:300px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.leftcol>*{pointer-events:auto}
.shift{padding:12px 14px}
.shift-h{display:flex;align-items:center;gap:8px}
.shift-h h3{margin:0;font-size:12.5px;font-weight:700}
.shift-h .stars{margin-left:auto}
.stars{display:flex;gap:2px;color:var(--line)}
.stars svg{width:14px;height:14px}
.stars .on{color:var(--safety)}
.modechip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--cobalt-soft);color:var(--cobalt)}
.modechip.daily{background:#ffe9dc;color:var(--flame)}
.goal{margin-top:10px}
.goal .gl{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.goal .gl span{color:var(--ink-2)}
.goal .gl b{font-family:var(--f-mono);font-size:12px}
.goal.met .gl b{color:var(--ok)}
.goal.met .gl b::after{content:" ✓"}
.effects{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.effects:empty{display:none}
.goals-mini{display:none}
.shift-free{color:var(--ink-2);font-size:12px;margin:6px 0 0;line-height:1.45}
.shift-free button{color:var(--cobalt);font-weight:700;padding:0}

.incident{padding:12px 14px;border-color:rgba(199,127,12,.35);position:relative;overflow:hidden;animation:slidein .3s ease-out}
@keyframes slidein{from{transform:translateX(-12px);opacity:0}}
.incident.bad{border-color:rgba(210,75,66,.35)}
.incident.info{border-color:rgba(47,91,224,.3)}
.inc-h{display:flex;align-items:flex-start;gap:10px}
.inc-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--warn-soft);color:var(--warn)}
.incident.bad .inc-ic{background:var(--bad-soft);color:var(--bad)}
.incident.info .inc-ic{background:var(--cobalt-soft);color:var(--cobalt)}
.inc-ic svg{width:16px;height:16px}
.inc-h h4{margin:0;font-size:13px}
.inc-h p{margin:3px 0 0;color:var(--ink-2);font-size:12px;line-height:1.4}
.inc-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.inc-acts button{flex:1 1 120px;text-align:left;border:1px solid var(--line);background:var(--glass-solid);border-radius:9px;padding:7px 10px;font-weight:700;font-size:12px;display:flex;flex-direction:column;gap:1px}
.inc-acts button small{font-weight:500;color:var(--ink-3);font-size:10.5px}
.inc-acts button kbd{font-family:var(--f-mono);font-size:9.5px;color:var(--ink-3);font-weight:500;margin-left:4px}
.inc-acts button.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.inc-acts button.primary small,.inc-acts button.primary kbd{color:rgba(255,255,255,.75)}
.inc-acts button:hover{filter:brightness(.97)}
.inc-timer{position:absolute;left:0;bottom:0;height:3px;background:var(--warn);opacity:.6}
.incident.bad .inc-timer{background:var(--bad)} .incident.info .inc-timer{background:var(--cobalt)}
.inc-more{font-size:10.5px;color:var(--ink-3);margin-top:6px}

/* side panel */
.panel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:340px;display:flex;flex-direction:column;overflow:hidden}
.p-head{padding:14px 14px 0}
.handle{display:none}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt)}
.p-title h2{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.p-title p{margin:1px 0 0;color:var(--ink-3);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:700;white-space:nowrap;background:var(--mute-soft);color:var(--ink-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.gold{background:var(--safety-soft);color:var(--safety-ink)}
.pill.flame{background:#ffe9dc;color:var(--flame)}
.pill.rush{background:var(--bad);color:#fff;padding:1px 6px;font-size:9.5px}
.tabs{display:flex;gap:0;margin:12px -14px 0;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 6px;font-weight:700;font-size:12px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--cobalt)}
.tabs .count{font-family:var(--f-mono);font-size:10px;background:var(--mute-soft);border-radius:5px;padding:0 4px;color:var(--ink-2)}
.tabs .count.hot{background:var(--bad-soft);color:var(--bad)}
.panel.building .tabs,.panel.building .chips{display:none}
.p-body{flex:1;overflow:auto;padding:6px 14px 14px;min-height:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--mute-soft)}
.row.hl{background:var(--cobalt-soft);border-radius:8px}
.row.late .t small{color:var(--bad)}
.row.owned{opacity:.6}
.sw{width:26px;height:26px;border-radius:7px;position:relative;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.sw::after{content:"";position:absolute;left:0;right:0;top:45%;height:3px;background:rgba(255,255,255,.45)}
.row .t{min-width:0}
.row .t b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--ink-3);font-size:11px;white-space:normal;line-height:1.35}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .r .mono{font-weight:700;font-size:12.5px}
.act{font-size:11px;font-weight:700;color:var(--cobalt);background:var(--cobalt-soft);border-radius:7px;padding:3px 8px;white-space:nowrap}
.act.solid{background:var(--cobalt);color:#fff}
.act:hover:not(:disabled){filter:brightness(.96)}
.badge{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:10.5px;background:var(--mute-soft);color:var(--ink-2);flex:none}
.badge svg{width:14px;height:14px}
.badge.fl{background:#fff2d1;color:#a46a00}
.badge.tmp{background:#dff4f1;color:#13786d}
.badge.tk{background:var(--cobalt-soft);color:var(--cobalt)}
.badge.rush,.badge.down{background:var(--bad-soft);color:var(--bad)}
.sub{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:12px 4px 2px}
.sub .act{letter-spacing:0;text-transform:none}
.bar-s{width:56px;height:4px;border-radius:4px;background:var(--mute-soft);overflow:hidden}
.bar-s i{display:block;height:100%;background:var(--ok);border-radius:inherit}
.bar-s.warn i{background:var(--warn)} .bar-s.bad i{background:var(--bad)} .bar-s.info i{background:var(--cobalt)}
.log{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12px}
.log time{font-family:var(--f-mono);color:var(--ink-3);font-size:11px}
.log span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--ink-3)}
.log.ok span::before{background:var(--ok)} .log.warn span::before{background:var(--warn)} .log.info span::before{background:var(--cobalt)} .log.bad span::before{background:var(--bad)}
.empty{color:var(--ink-3);font-size:12px;padding:10px 4px;line-height:1.45}
.build-head{display:flex;align-items:center;gap:8px;margin:8px 4px 4px}
.build-head b{font-family:var(--f-display);font-weight:800;font-size:15px}
.build-head .act{margin-left:auto}

/* shipment / selection card */
.track{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:min(640px,calc(100% - 400px));padding:12px 14px;display:flex;gap:14px;align-items:stretch}
.track-main{flex:1;min-width:0}
.th{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.th .ic{width:24px;height:24px;border-radius:7px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.th .ic svg{width:14px;height:14px}
.th .mono{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(6,1fr)}
.steps li{position:relative;text-align:center;font-size:10.5px;color:var(--ink-3);font-weight:600;min-width:0}
.steps li::before{content:"";position:absolute;top:10px;left:-50%;right:50%;height:2px;background:var(--line)}
.steps li:first-child::before{display:none}
.steps li.done::before,.steps li.now::before{background:var(--cobalt)}
.steps .dot{position:relative;z-index:1;width:22px;height:22px;margin:0 auto 5px;border-radius:50%;background:var(--glass-solid);border:2px solid var(--line);display:grid;place-items:center}
.steps li.done .dot{background:var(--cobalt);border-color:var(--cobalt)}
.steps li.done .dot::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.steps li.now .dot{border-color:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-soft)}
.steps li.now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cobalt);animation:blink 1.4s infinite}
.steps li.done,.steps li.now{color:var(--ink)}
.steps li span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps time{display:block;font-family:var(--f-mono);font-size:10px;color:var(--ink-3);font-weight:500;margin-top:1px}
.track-side{width:190px;flex:none;background:var(--glass-solid);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)}
.track-side b{color:var(--ink);font-family:var(--f-mono);font-size:12.5px}
.track-side .focus{margin-top:auto;align-self:flex-start;color:var(--cobalt);font-weight:700;font-size:11.5px;padding:2px 0}
.fl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mini{background:var(--glass-solid);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.mini label{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600}
.mini b{font-family:var(--f-mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
body.building .track,body.building .leftcol,body.building .kpis{display:none}

/* camera controls */
.cam{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:368px;display:flex;flex-direction:column;padding:4px;gap:2px}
.cam button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2)}
.cam button:hover{background:var(--mute-soft);color:var(--ink)}
.cam button svg{width:16px;height:16px}
.cam hr{border:0;border-top:1px solid var(--line);margin:2px 4px}

/* floating tag, score pops, toasts, coach, confetti */
.tag3d{position:fixed;left:0;top:0;pointer-events:none;background:var(--cobalt);color:#fff;font-family:var(--f-mono);font-size:11px;font-weight:700;padding:4px 8px;border-radius:7px;white-space:nowrap;box-shadow:var(--shadow);z-index:3}
.tag3d::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.tag3d small{font-family:var(--f-body);font-weight:500;opacity:.75;margin-left:6px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.pop{position:absolute;left:0;top:0;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--ok);text-shadow:0 1px 0 #fff,0 0 6px rgba(255,255,255,.9);white-space:nowrap}
.pop.bad{color:var(--bad)} .pop.info{color:var(--cobalt)} .pop.gold{color:var(--safety-ink);font-size:17px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:8}
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(360px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:10px;width:100%;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(20,34,60,.3);animation:tin .35s cubic-bezier(.2,1.4,.4,1)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(-14px) scale(.96);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.12)}
.toast .ti svg{width:16px;height:16px}
.toast.ach .ti{background:var(--safety);color:var(--ink)}
.toast.lvl .ti{background:var(--cobalt)}
.toast.daily .ti{background:var(--flame)}
.toast b{display:block;font-size:12.5px}
.toast small{display:block;font-size:11px;opacity:.75}
.coach{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);width:min(370px,calc(100% - 32px));z-index:4;padding:14px 16px;border-color:rgba(47,91,224,.35)}
.coach .cstep{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cobalt)}
.coach h4{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:17px}
.coach p{margin:4px 0 0;color:var(--ink-2);font-size:12.5px;line-height:1.45}
.coach .cfoot{display:flex;align-items:center;gap:8px;margin-top:12px}
.coach .cfoot .wait{font-size:11.5px;color:var(--ink-3);font-weight:600}
.coach .skip{margin-left:auto;color:var(--ink-3);font-weight:600;font-size:11.5px}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);font-size:11.5px;color:var(--ink-2);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px;transition:opacity .6s;white-space:nowrap}
.buildbar{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;white-space:nowrap}
.buildbar b{font-family:var(--f-display);font-weight:800}
.buildbar span{color:var(--ink-2);font-size:12px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--ink-2);background:var(--ground);z-index:10;text-align:center;padding:0 16px}

/* modal */
.modal{position:fixed;inset:0;z-index:5;background:var(--scrim);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto}
.sheet{width:min(900px,100%);max-height:100%;overflow:auto;background:var(--glass-solid);border-radius:18px;box-shadow:0 20px 60px rgba(20,34,60,.25);padding:22px;display:flex;flex-direction:column}
.sheet h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;text-wrap:balance}
.sheet .lede{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;max-width:62ch;line-height:1.45}
.m-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.m-top .who{margin-left:auto;display:flex;align-items:center;gap:14px}
.credits{text-align:right;white-space:nowrap}
.credits label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.credits b{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.rankcard{display:flex;align-items:center;gap:10px}
.rankcard .n{width:38px;height:38px;border-radius:11px;background:var(--safety);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.rankcard b{display:block;font-size:13px}
.rankcard small{display:block;color:var(--ink-3);font-size:11px}
.rankcard .meter{width:120px}
.mnav{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mnav button{padding:10px 12px;font-weight:700;font-size:13px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mnav button[aria-selected="true"]{color:var(--ink);border-color:var(--cobalt)}
.mnav .dot{width:7px;height:7px;border-radius:50%;background:var(--flame)}
.mbody{padding-top:16px}
.banner{display:flex;align-items:center;gap:14px;background:var(--cobalt-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px;flex-wrap:wrap}
.banner b{display:block;font-size:14px}
.banner span{color:var(--ink-2);font-size:12.5px}
.banner .btn{margin-left:auto}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
#insp .wide{width:100%;margin-top:12px;justify-content:center;padding:9px}
#insp .inote{font-size:12px;color:var(--ink-2);margin:10px 2px 0;line-height:1.45}
.sitecard{position:relative;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--glass-solid)}
.sitecard:hover:not(:disabled){background:#fbfcff}
.sitecard[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.sitecard .sc-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.sitecard .code{font-family:var(--f-mono);font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:3px 6px}
.sitecard h3{margin:0;font-size:15px;font-family:var(--f-display);font-weight:800;letter-spacing:-.01em}
.sitecard p{margin:0;color:var(--ink-2);font-size:12px;line-height:1.4}
.sitecard .facts{display:flex;flex-wrap:wrap;gap:4px}
.sitecard .diff{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);font-weight:600}
.diff i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.diff i.on{background:var(--bad)}
.sitecard .lock{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-top:auto}
.sitecard .lock svg{width:13px;height:13px}
.sitecard:disabled{opacity:1;background:var(--mute-soft)}
.sitecard:disabled h3,.sitecard:disabled p,.sitecard:disabled .facts{opacity:.6}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.m-box{border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.m-box h2{margin:0 0 4px;font-size:13px;font-weight:700}
.m-box .note{color:var(--ink-3);font-size:11.5px;margin:0 0 6px;line-height:1.4}
.brief ul{list-style:none;margin:0;padding:0}
.brief li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.brief li:last-child{border-bottom:0}
.brief b{font-family:var(--f-mono)}
.brief ul.rules{margin:10px 0 0;padding:0 0 0 16px;list-style:disc;color:var(--ink-2);font-size:12px;line-height:1.55}
.brief ul.rules li{display:list-item;border:0;padding:0}
.up{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.up:last-child{border-bottom:0}
.up b{font-size:12.5px}
.up small{display:block;color:var(--ink-3);font-size:11px}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.pips i{width:12px;height:5px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--cobalt)}
.buy{font-weight:700;font-size:12px;border-radius:8px;padding:6px 10px;background:var(--cobalt-soft);color:var(--cobalt);white-space:nowrap;font-family:var(--f-mono)}
.m-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.btn{height:42px;padding:0 18px;border-radius:11px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--cobalt);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.flame{background:var(--flame);color:#fff}
.btn.ghost{background:var(--mute-soft);color:var(--ink)}
.btn.link{color:var(--ink-2);padding:0 6px}
.btn.danger{background:var(--bad);color:#fff}
.daily-card{border:1.5px solid #f6c7ad;background:linear-gradient(180deg,#fff7f2,#fff);border-radius:16px;padding:16px}
.daily-card .dh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.daily-card h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px}
.daily-card .date{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.flame{display:inline-flex;align-items:center;gap:6px;color:var(--flame);font-weight:800;font-family:var(--f-display);font-size:18px}
.flame svg{width:20px;height:20px}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.mod{background:var(--glass-solid);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mod b{font-size:12.5px;display:block}
.mod small{color:var(--ink-2);font-size:11.5px}
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;text-align:center;border-radius:9px;padding:6px 0;background:var(--mute-soft);font-size:10.5px;font-weight:700;color:var(--ink-3)}
.week div.done{background:#ffe9dc;color:var(--flame)}
.week div.today{outline:2px solid var(--flame);outline-offset:-2px}
.week div i{display:block;font-style:normal;font-size:14px;line-height:1.3}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.achv{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.achv .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--mute-soft);color:var(--ink-3);flex:none}
.achv .ai svg{width:16px;height:16px}
.achv.got .ai{background:var(--safety);color:var(--ink)}
.achv b{display:block;font-size:12.5px}
.achv small{display:block;color:var(--ink-2);font-size:11.5px;line-height:1.35}
.achv time{display:block;color:var(--ink-3);font-size:10.5px;margin-top:2px;font-family:var(--f-mono)}
.achv:not(.got) b{color:var(--ink-2)}
.cosgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cos{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px}
.cos.on{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.cos b{font-size:12px}
.cosw{width:100%;height:22px;border-radius:6px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.tinfo{border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--mute-soft)}
.tinfo.own{background:var(--ok-soft)} .tinfo.sale{background:var(--cobalt-soft)}
.tinfo b{display:block;font-size:12.5px} .tinfo small{display:block;color:var(--ink-2);font-size:11.5px;margin-top:1px}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.toggle:last-child{border-bottom:0}
.switch{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--cobalt)}
.switch[aria-pressed="true"]::after{transform:translateX(16px)}
input[type=range]{width:140px;accent-color:var(--cobalt)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;color:var(--ink-2)}
.keys kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--mute-soft);color:var(--ink);justify-self:start}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--bad);font-weight:600}
.report-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:14px}
.big-score{font-family:var(--f-display);font-weight:800;font-size:56px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big-stars{display:flex;gap:6px;color:var(--line)}
.big-stars svg{width:42px;height:42px}
.big-stars .on{color:var(--safety);animation:starpop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.big-stars .on:nth-child(2){animation-delay:.35s}.big-stars .on:nth-child(3){animation-delay:.7s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.xpline{flex:1;min-width:220px}
.xpline .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.xpline .meter{height:8px}
.xpline .meter i{transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.ledger li:last-child{border-bottom:0}
.ledger b{font-family:var(--f-mono)}
.ledger .neg{color:var(--bad)}
.callout{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.callout svg{width:16px;height:16px;flex:none}
.callout.ok{background:var(--ok-soft);color:var(--ok)}
.callout.gold{background:var(--safety-soft);color:var(--safety-ink)}
.callout.flame{background:#ffe9dc;color:var(--flame)}
.callout.mute{background:var(--mute-soft);color:var(--ink-2)}


/* inspector card (top right), site/notification dropdowns, profile chip */
.insp{position:absolute;top:calc(env(safe-area-inset-top,0px) + 74px);right:16px;width:340px;max-height:calc(100% - 74px - min(330px,40vh) - 42px - env(safe-area-inset-bottom,0px));overflow:auto;padding:12px 14px}
.ih{display:flex;gap:10px;align-items:flex-start}
.iic{width:40px;height:40px;border-radius:11px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;flex:none}
.iic svg{width:20px;height:20px}
.it{flex:1;min-width:0}
.it .eyebrow{font-size:9.5px}
.it h2{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it p{margin:1px 0 0;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtns{display:flex;gap:4px;flex:none}

.ib.on{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.istat{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--ink-2);min-width:0}

.link{color:var(--cobalt)}

.ddi svg{width:14px;height:14px;color:var(--ink-3)}

.ddi b{display:block;font-size:12.5px}
.ddi small{display:block;color:var(--ink-3);font-size:11px}
.ddi .meter{margin-top:5px}
.ddnote{font-size:11px;color:var(--ink-3);padding:6px 8px 4px}
.ddh{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 8px}
.ddh b{font-size:13px}
.ddn{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px;border-top:1px solid var(--line);font-size:12px}

.ddn small{display:block;color:var(--ink-2);font-size:11px}

/* ---- rules: signals, following distance, yielding ---- */
function heading(o){return [Math.cos(o.yaw),-Math.sin(o.yaw)];}
const FRONT={car:1.3,van:1.9,tk:5.3};
function bodyPts(v){const [dx,dz]=heading(v),F=FRONT[v.kind]||1.3,B=v.kind==='tk'?5.2:1.3,X=wx(v);return [[X+dx*F,v.z+dz*F],[X,v.z],[X-dx*B,v.z-dz*B]];}

}
function leaderBlocked(o){

  }

}
let UID=0; const uidOf=o=>o.uid||(o.uid=++UID);
function untangle(o,L){if(Math.hypot(wx(L)-wx(o),L.z-o.z)>=2.4)return null; if(uidOf(o)>uidOf(L)){o.blockT=0;o.gateT=0;return true;} o.ghost=0.5; return false;}

function vehBlocked(o,dt){

  const L=leaderBlocked(o);

function updateCars(dt){

    const blk=vehBlocked(c,dt), target=blk?0:c.vmax;

function bfs(from,to){
  const prev=new Map([[from,null]]),q=[from];
  while(q.length){const k=q.shift();if(k===to)break;const t=town.tiles.get(k);for(let d=0;d<4;d++){const n=nbT(t,d);if(isRoadT(n)&&!prev.has(n.key)){prev.set(n.key,k);q.push(n.key);}}}
  if(!prev.has(to))return null; const path=[];let k=to;while(k){path.unshift(town.tiles.get(k));k=prev.get(k);} return path;
}
function dirBetween(a,b){for(let d=0;d<4;d++)if(a.i+DIRS[d][0]===b.i&&a.j+DIRS[d][1]===b.j)return d;return 0;}

function routeThrough(path,h,startPos,endOut){

    if(k===0&&startPos){ if(o==null)return; pts.push(...tilePathFrom(startPos,t,h,o)); h=o; return; }

    pts.push(...tilePath(t,h,o)); h=o;

function openOrdersFor(key){

  sim.orders.filter(m).forEach(o=>out.push({id:o.id,s:'In the pick queue'}));
  forklifts.forEach(f=>{if(f.task&&f.task.order&&m(f.task.order))out.push({id:f.task.order.id,s:'Being picked · '+f.id});});
  staging.forEach(x=>{if(m(x.order))out.push({id:x.order.id,s:'Staged at the dock'});});

function stockBySku(){const o={};SKU_KEYS.forEach(k=>o[k]={pallets:0,units:0,free:0});slots.forEach(s=>{if(s.pallet){const k=s.pallet.userData.sku;o[k].pallets++;o[k].units+=SKUS[k].units;if(!s.claimed)o[k].free++;}});return o;}

  SKU_KEYS.forEach(k=>{const c=k==='CHR'?2:Math.round(n*w[k]);for(let j=0;j<c&&free.length;j++)placeInSlot(free.pop(),makePallet(k));});

/* ---------------- movers ---------------- */
function runSteps(o,dt){
  let budget=dt;
  while(o.steps.length&&budget>0){
    const s=o.steps[0];
    if(s.t==='move'){
      const dx=s.x-o.x,dz=s.z-o.z,d=Math.hypot(dx,dz);
      if(d<0.01){o.x=s.x;o.z=s.z;o.steps.shift();continue;}
      const ty=s.rev?Math.atan2(dz,-dx):Math.atan2(-dz,dx);
      const diff=angDiff(ty,o.yaw);
      o.yaw+=clamp(diff,-o.turn*budget,o.turn*budget);
      if((o.kind==='tk'||o.kind==='van')&&!s.rev&&!(o.kind==='tk'&&!o.xfer&&lx(o)<15.5)&&(o.kind==='van'&&o.z>-18.6&&Math.abs(lx(o)-12)<2.7?vanAhead(o,budget):vehBlocked(o,budget))){budget=0;break;}
      if(Math.abs(diff)<o.gate){
        const f=Math.cos(Math.min(Math.abs(diff),1.4));
        const sp=(s.rev?o.rspd:o.spd)*(s.slow||1)*f;
        const st=Math.min(d,sp*budget); o.x+=dx/d*st; o.z+=dz/d*st;
      }
      budget=0;
    }else if(s.t==='turn'){
      const diff=angDiff(s.yaw,o.yaw);
      if(Math.abs(diff)<0.01){o.yaw=s.yaw;o.steps.shift();continue;}
      o.yaw+=clamp(diff,-o.turn*budget,o.turn*budget); budget=0;
    }else if(s.t==='lift'){
      const d=s.y-o.forkY;
      if(Math.abs(d)<0.005){o.forkY=s.y;o.steps.shift();continue;}
      o.forkY+=clamp(d,-1.6*budget,1.6*budget); budget=0;
    }else if(s.t==='wait'){
      s.s-=budget; if(s.s<=0){budget=-s.s;o.steps.shift();continue;} budget=0;
    }else if(s.t==='do'){o.steps.shift();s.fn();}
  }
}
function planner(o){
  const c={x:o.x,z:o.z},S=[];
  const P={
    go(tx,tz){
      if(Math.abs(c.z-tz)<.05){if(Math.abs(c.x-tx)>.05)S.push({t:'move',x:tx,z:tz});}
      else{ if(Math.abs(c.x-MAINX)>.05)S.push({t:'move',x:MAINX,z:c.z}); S.push({t:'move',x:MAINX,z:tz}); if(Math.abs(tx-MAINX)>.05)S.push({t:'move',x:tx,z:tz}); }
      c.x=tx;c.z=tz;return P;},
    mv(tx,tz,rev,slow){S.push({t:'move',x:tx,z:tz,rev,slow});c.x=tx;c.z=tz;return P;},
    turn(y){S.push({t:'turn',yaw:y});return P;},
    lift(y){S.push({t:'lift',y});return P;},
    wait(s){S.push({t:'wait',s});return P;},
    act(fn){S.push({t:'do',fn});return P;},
    steps:S};
  return P;
}

function updateForklift(f,dt){
  const ud=f.g.userData;
  if(f.broken){
    if(sim.sec>=f.broken){f.broken=0;ud.warn.visible=false;ud.beacon.color.set('#ffb020');ud.beacon.emissive.set('#ff9a00');log(f.id+' repaired and back on the floor','ok');}
    else{ud.beacon.color.set('#ff3b30');ud.beacon.emissive.set('#ff3b30');ud.beacon.emissiveIntensity=Math.sin(perf*6)>0?1.4:.3;ud.warn.position.y=3.0+Math.sin(perf*3)*.08;place(f);return;}
  }

    else if(f.charging&&f.battery<92){ const ch=chargers[HOMES.indexOf(f.home)]; if(ch){if(!f.chgOn){f.chgOn=true;ch.sessions++;} ch.kwh+=dt*rate*0.048;} f.battery=Math.min(100,f.battery+dt*rate); f.task={type:'Charging',text:'Charging at the wall'+(f.fast?' (fast charger)':'')}; }
    else{

function dispatchQueue(){
  let q=trucks.filter(t=>t.state==='queued').sort((a,b)=>a.z-b.z);
  const laneBusy=trucks.some(t=>t.state==='departing'&&t.z>-16);
  if(!laneBusy&&!game.hands)for(const t of q){if(t.z>30)break;const bay=bays.find(b=>!b.truck);if(!bay)break;assignBay(t,bay);break;}
  q=trucks.filter(t=>t.state==='queued').sort((a,b)=>a.z-b.z);
  q.forEach((t,i)=>{let tz=[16,40,68,80][i]||80+12*(i-3);if(tz>t.z+0.1)tz=t.z;const s=t.steps[0];
    if(!(s&&Math.abs(s.z-tz)<.1)&&Math.abs(t.z-tz)>.1) t.steps=[{t:'move',x:21.6,z:tz}];
    if(!t.atGate&&t.z<47){t.atGate=true;t.times.gate=clockMin();}
    const wait=t.atGate?clockMin()-t.times.gate:0;
    if(game.phase==='shift'&&wait>15){const n=Math.min(6,Math.floor((wait-15)/5)+1);while(t.detPaid<n){t.detPaid++;game.st.detention++;game.ledger.det-=2;addScore(-2,'det',t.x,4.5,t.z,true);}}
  });

function departTruck(t){

function onStaged(o,st){

    game.ledger.combo+=pts-base;

function rollEvent(force){
  const kinds=[];
  const working=forklifts.filter(f=>!f.broken&&!f.temp&&!f.remove);
  if(working.length>=2&&!game.mods.has('calm')) kinds.push('breakdown','breakdown');
  const openRows=ROWS.map((_,r)=>r).filter(r=>!blocked(r));
  if(openRows.length===ROWS.length) kinds.push('spill');
  kinds.push('rush','rush'); if(game.mods.has('rush'))kinds.push('rush','rush','rush');
  if(sim.enroute.length) kinds.push('delay');
  if(game.surgeUntil<sim.sec) kinds.push('surge');
  const k=force||pick(kinds);
  if(k==='breakdown'){
    const pool=working.length?working:forklifts.filter(f=>!f.broken); if(!pool.length)return;
    const f=pick(pool); abortTask(f); f.broken=sim.sec+90; f.g.userData.warn.visible=true;
    log(f.id+' hydraulic fault, stopped on the floor','bad');
    raise({tone:'bad',icon:ICON.wrench,title:f.id+' broke down',body:'Hydraulic fault on the mast. It stays where it is'+(f.carry?', pallet still on the forks,':'')+' until someone fixes it.',
      options:[{label:'Call a mechanic',note:'−40 · fixed in 20 min',cost:40,fix:true,primary:true,fn:()=>{f.broken=Math.min(f.broken,sim.sec+20);}},{label:'Wait for the shift tech',note:'free · fixed in 90 min'}],def:1});
  }else if(k==='spill'){
    const r=pick(openRows); sim.blocked[r]=sim.sec+60; addSpill(r);
    forklifts.forEach(f=>{if(f.task&&f.task.slot&&f.task.slot.r===r&&!f.task.picked)abortTask(f);});
    log('Spill in aisle '+'ABCD'[r]+', aisle closed','bad');
    raise({tone:'warn',icon:ICON.drop,title:'Spill in aisle '+'ABCD'[r],body:'A drum of floor cleaner tipped over. Forklifts cannot use aisle '+'ABCD'[r]+(r===ROWS.length-1?', and that also blocks outbound staging.':'.'),
      options:[{label:'Send cleanup crew',note:'−20 · clear in 8 min',cost:20,fix:true,primary:true,fn:()=>{sim.blocked[r]=sim.sec+8;}},{label:'Leave it',note:'free · closed for 60 min'}],def:1});
  }else if(k==='rush'){
    const st=stockBySku(); const avail=SKU_KEYS.filter(s=>st[s].free>0); if(!avail.length)return;
    const o=newOrder(true); o.sku=pick(avail); const pay=game.mods.has('rush')?60:40;
    raise({tone:'info',icon:ICON.clock,title:'Rush order '+o.id,body:'A customer needs 1 pallet of '+SKUS[o.sku].name+' staged for shipping within 25 minutes.',
      options:[{label:'Accept rush',note:'+'+pay+' if on time',primary:true,fn:()=>{o.due=clockMin()+25;sim.orders.unshift(o);log(o.id+' rush order accepted','info');}},{label:'Decline',note:'−10 goodwill',cost:10}],def:0});
  }else if(k==='delay'){
    const sh=sim.enroute[0]; if(!sh)return; sh.eta+=25; sh.late=true;
    log(sh.id+' '+sh.car.name+' stuck in traffic, +25 min','warn');
    raise({tone:'warn',icon:ICON.truck,title:sh.id+' delayed',body:sh.car.name+' is stuck on the turnpike. It now arrives at '+fmtT(sh.eta)+'.',
      options:[{label:'Book a backup carrier',note:'−30 · truck in 3 min',cost:30,fix:true,primary:true,fn:()=>{const b=scheduleTruck(3);log(b.id+' backup carrier booked','info');}},{label:'Accept the delay',note:'free'}],def:1});
  }else if(k==='surge'){
    game.surgeUntil=sim.sec+45;
    log('Order surge from a flash sale, 45 min','warn');
    raise({tone:'warn',icon:ICON.bolt,title:'Flash sale order surge',body:'Orders will drop in twice as fast for the next 45 minutes.',
      options:[{label:'Hire a temp driver',note:'−60 · extra forklift for 60 min',cost:60,fix:true,primary:true,fn:()=>hireTemp(60)},{label:'Ride it out',note:'free'}],def:1});
  }
}

function setStack(L){
  L.bays.forEach(b=>{
    const t=b.truck, want=!t?0:t.dir==='out'?Math.min(3,t.n-t.done):Math.min(3,t.done);
    while(b.stack.children.length>want)b.stack.remove(b.stack.children[b.stack.children.length-1]);
    while(b.stack.children.length<want){const p=makePallet(pick(SKU_KEYS));p.position.set(-0.6+b.stack.children.length*1.25,0.02,0);p.userData.sel=null;b.stack.add(p);}
    b.pin.visible=!!(t&&t.dir==='out'&&want>0);
  });
}
function spawnLiteTruck(L,dir,bay){
  const car=pick(CARRIERS), g=makeTruck(car,false); env.add(g);
  const n=dir==='out'?irand(4,7):irand(3,6), now=clockMin();
  const t={kind:'tk',lite:L,ox:L.ox,id:'TRK-'+(++liteSeq),ship:'#SHP-'+(80000+liteSeq*7%9999),car,dir,n,done:0,g,bay:null,state:'queued',
    dest:dir==='out'?DESTS[(liteSeq*3)%DESTS.length]:L.s.code+' '+L.s.name,from:dir==='in'?car.from:L.s.code+' '+L.s.name,
    x:21.6+L.ox,z:SPAWN_Z,yaw:Math.PI/2,steps:[],spd:6,rspd:2.2,turn:1.0,gate:1.25,blockT:0,ghost:0,cargo:[],unloaded:0,
    times:{gate:now,arrived:null,done:null,confirmed:now-irand(260,420)}};
  t.times.picked=t.times.confirmed+irand(50,90); t.times.loaded=t.times.confirmed+irand(110,150);
  g.userData.sel=t; L.trucks.push(t); liteTrucks.push(t);
  if(bay){t.atGate=true;t.bay=bay;bay.truck=t;t.x=6+L.ox;t.z=bay.z;t.yaw=0;t.state=dir==='in'?'unloading':'loading';t.times.arrived=now;bay.open=1;}
  else L.inbound++;
  placeL(t); return t;
}
function liteDock(L,t,b){
  t.bay=b; b.truck=t; t.state='docking'; L.inbound=Math.max(0,L.inbound-1);
  const ox=L.ox, P=planner(t);
  P.mv(21.6+ox,b.z+3.2).mv(20.2+ox,b.z).mv(6+ox,b.z,true,.8).act(()=>{t.state=t.dir==='in'?'unloading':'loading';t.times.arrived=clockMin();b.count++;setStack(L);});
  t.steps=P.steps;
}
function liteDepart(L,t){
  t.state='departing'; t.times.done=clockMin(); const b=t.bay, ox=L.ox;
  L.done++; if(t.times.done-t.times.gate<=70)L.onTime++; else L.late++;
  L.fill=clamp(L.fill+(t.dir==='in'?0.035:-0.04),0.2,0.95);
  const P=planner(t);
  P.wait(1.2).mv(15+ox,b.z).mv(21.6+ox,b.z-4.5).mv(21.6+ox,b.z-7).act(()=>{b.truck=null;setStack(L);}).mv(21.6+ox,EXIT_Z).act(()=>{t.gone=true;});
  t.steps=P.steps;
}
function liteForklift(L,f,dt){
  if(f.steps.length){runSteps(f,dt);placeL(f);f.g.userData.carriage.position.y=0.1+f.forkY;return;}
  const ox=L.ox, mine=L.bays.filter((b,i)=>Math.floor(i/2)===f.home);
  const b=mine.find(b=>b.truck&&(b.truck.state==='unloading'||b.truck.state==='loading')&&b.truck.done<b.truck.n&&!b.truck.busy);
  const P=planner(f), zl=z=>z+2.3;
  const carry=on=>()=>{const c=f.g.userData.carriage; if(on&&!f.carry){f.carry=makePallet(pick(SKU_KEYS));f.carry.userData.sel=null;f.carry.position.set(0.55,0.05,0);c.add(f.carry);} if(!on&&f.carry){c.remove(f.carry);f.carry=null;}};
  if(b){
    const t=b.truck; t.busy=f; f.task=(t.dir==='in'?'Unloading ':'Loading ')+t.id;
    const door=[1.9+ox,zl(b.z)], yard=[9.2+ox,zl(b.z)];
    const [a,c]=t.dir==='in'?[door,yard]:[yard,door];
    P.mv(a[0],a[1]).turn(t.dir==='in'?Math.PI:0).lift(0.05).wait(0.6).act(carry(true)).lift(0.25)
     .mv(c[0],c[1],false,.8).lift(0.05).wait(0.5).act(carry(false)).act(()=>{t.done++;t.busy=null;f.moved++;setStack(L);});
    f.battery=Math.max(10,f.battery-0.8);
  }else{
    f.task='Idle'; const hz=zl((mine[0]||L.bays[0]).z);
    if(Math.hypot(f.x-(2.4+ox),f.z-hz)>0.2)P.mv(2.4+ox,hz); P.wait(1.5);
    f.battery=Math.min(100,f.battery+0.6);
  }
  f.steps=P.steps;
}
function updateLite(L,dt){
  L.next-=dt;
  if(L.next<=0){
    const q=L.trucks.filter(t=>t.state==='queued').length;
    if(q<3) spawnLiteTruck(L,L.R()<0.5?'in':'out',null);
    const r=L.s.truckRate; L.next=rand(r[0],r[1])*0.55;
  }
  const xferOut=xfers.some(t=>t.from===L.idx&&t.z>-19), laneBusy=xferOut||L.trucks.some(t=>t.state==='departing'&&t.z>-16);
  if(!laneBusy)for(const t of L.trucks.filter(t=>t.state==='queued').sort((a,b)=>a.z-b.z)){if(t.z>30)break;const b=L.bays.find(b=>!b.truck);if(!b)break;liteDock(L,t,b);break;}
  L.trucks.filter(t=>t.state==='queued').sort((a,b)=>a.z-b.z).forEach((t,i)=>{let tz=[16,40,68,80][i]||80+12*(i-3);if(tz>t.z+0.1)tz=t.z;const s=t.steps[0];
    if(!(s&&Math.abs(s.z-tz)<.1)&&Math.abs(t.z-tz)>.1)t.steps=[{t:'move',x:21.6+L.ox,z:tz}];
    if(!t.atGate&&t.z<47){t.atGate=true;t.times.gate=clockMin();}});
  for(let i=L.trucks.length-1;i>=0;i--){
    const t=L.trucks[i]; runSteps(t,dt);
    if((t.state==='unloading'||t.state==='loading')&&t.done>=t.n&&!t.busy&&!t.steps.length&&!L.trucks.some(x=>x.state==='docking'||(x.state==='departing'&&x.z>-16))&&!xferOut) liteDepart(L,t);
    placeL(t);
    if(t.gone){env.remove(t.g);L.trucks.splice(i,1);const k=liteTrucks.indexOf(t);if(k>=0)liteTrucks.splice(k,1);if(selected===t)select(null);}
  }
  L.fls.forEach(f=>liteForklift(L,f,dt));
  L.bays.forEach(b=>{
    const want=b.truck&&(b.truck.state==='unloading'||b.truck.state==='loading'||(b.truck.state==='docking'&&b.truck.x-L.ox<9))?1:0;
    b.open+=clamp(want-b.open,-dt*0.9,dt*0.9); const sc=1-0.88*b.open; b.door.scale.y=sc; b.door.position.y=3.85-3.6*sc/2;
    const c=b.truck?(b.truck.state==='docking'?'#f0a623':'#e0564b'):'#24b46e'; b.lightMat.color.set(c); b.lightMat.emissive.set(c);
  });
}
function liteStats(L){
  const docked=L.bays.filter(b=>b.truck&&b.truck.state!=='docking').length, queued=L.trucks.filter(t=>t.state==='queued').length;
  const out=L.trucks.filter(t=>t.dir==='out'&&t.state!=='departing').length, inn=L.trucks.filter(t=>t.dir==='in'&&t.state!=='departing').length;
  const n=L.onTime+L.late;
  return {fill:L.fill,docked,queued,out,inn,onTime:n?Math.round(L.onTime/n*100):96,done:L.done,working:L.fls.filter(f=>f.task!=='Idle').length,units:Math.round(L.fill*L.s.rows*16*2*40)};
}
function liteTruckStatus(t){
  if(t.state==='queued')return t.atGate?['At gate','warn']:['Driving in','info'];
  if(t.state==='docking')return['Docking','warn'];
  if(t.state==='unloading')return['Unloading '+t.done+'/'+t.n,'info'];
  if(t.state==='loading')return['Loading '+t.done+'/'+t.n,'ok'];
  return[t.dir==='out'?'On the road':'Departing',''];
}

/* ---------------- site loading ---------------- */
function computeLayout(s){
  const b=siteBuilds(s.code);
  const rows=Math.min(4,s.rows+(b.row?1:0));
  return {bays:Math.min(5,s.bays+(b.bays|0)),rows,l3:(b.l3||[]).filter(r=>r<rows),fc:b.fc||[],brk:!!b.brk,decor:b.decor||[]};
}
function loadSite(idx){
  site=SITES[idx]; game.siteIdx=idx; L=computeLayout(site); OX=site.k*SLICE_W; world.position.set(OX,0,0); game.fly=null;
  while(world.children.length) world.remove(world.children[0]);
  trucks.length=0; forklifts.length=0; slots.length=0; staging.length=0; bays.length=0; spills.length=0; ghosts.length=0;
  pops.forEach(p=>p.el.remove()); pops.length=0; reqs.length=0; buildEnv(); clearVans();
  removeLite(idx); SITES.forEach((_,i)=>{if(i!==idx)buildLite(i);});
  ROWS=[-11,-6,-1,4].slice(0,L.rows);
  ROW_LV=ROWS.map((_,r)=>L.l3.includes(r)?3:2);
  BAY_Z=Array.from({length:L.bays},(_,i)=>(i-(L.bays-1)/2)*5);
  STAGE_Z=AISLE(ROWS[ROWS.length-1])+2.9;
  resetSim();
  buildSite(); buildBays(); buildSlots(); seedRacks();
  const n=clamp(site.forklifts+save.up.fl-(game.mods.has('short')?1:0),2,HOMES.length-1);
  for(let i=0;i<n;i++){const f=addForklift(false); if(i<2){f.x=MAINX;f.z=i?3:-4;f.yaw=i?FACE_POS_Z:FACE_NEG_Z;place(f);}}
  const ta=spawnTruck(newShipment(false),bays[0]); ta.assigned=ta.unloaded=2; ta.times.gate-=14; ta.times.arrived-=10;
  if(bays.length>2){const tb=spawnTruck(newShipment(false),bays[2]); tb.assigned=tb.unloaded=1; tb.times.gate-=6; tb.times.arrived-=4;}
  const tc=spawnTruck(newShipment(false),null); tc.z=40; place(tc);
  scheduleTruck(14);
  for(let i=0;i<3;i++){const o=newOrder(false);const st=stockBySku();if(st[o.sku].free>0)sim.orders.push(o);}
  sim.startStock=totalUnits();
  $('#siteCode').textContent=site.code; $('#siteCode').style.background=site.accent; $('#siteName').textContent=site.name;
  $('#pEyebrow').textContent='Distribution center · '+site.code; $('#pName').textContent=site.name; $('#pAddr').textContent=site.addr;
  select(null); defaultView(); resize(); dirty=true;
  if(game.building) showGhosts();
}
function freePlay(idx){game.mode='normal';game.mods=new Set();game.daily=null;RNG=Math.random;game.phase='free';loadSite(idx==null?game.siteIdx:idx);}
function startShift(idx,mode){

function endShift(){
  if(game.phase!=='shift')return;
  if(tut) endTutorial(false,true);
  game.phase='report';
  const G=site.goals, st=game.st, n=st.shipOn+st.lateOrders;
  const otr=n?st.shipOn/n*100:0;
  const met=[st.recv>=G.recv, st.shipOn>=G.ship, n>=5&&otr>=G.ontime];
  const stars=met.filter(Boolean).length; if(stars>=2&&!tut)mission('stars',1); if(stars>=2&&game.hands&&!tut)unlock('handson'); reqs.length=0;
  let credits=Math.max(0,Math.round(game.score/6))+stars*10;
  const levelBefore=levelOf(save.xp), xpBefore=save.xp;
  const isDaily=game.mode==='daily';
  let dailyRes=null;
  if(isDaily){
    const d=save.daily,key=game.daily.key, prevBest=d.best[key];
    d.best[key]=prevBest==null?game.score:Math.max(prevBest,game.score);
    const cleared=game.score>=game.daily.target;
    let reward=0,newClear=false;
    if(cleared&&d.last!==key){
      d.streak=d.last===dayOffset(-1)?d.streak+1:1; d.last=key; d.bestStreak=Math.max(d.bestStreak,d.streak);
      d.cleared=(d.cleared||[]).concat(key).slice(-40);
      reward=40+10*Math.min(d.streak,7); credits+=reward; newClear=true;
    }
    dailyRes={cleared,reward,newClear,target:game.daily.target,streak:streakNow(),best:d.best[key]};
  }else{
    const prev=save.best[site.code];
    save.best[site.code]={score:prev?Math.max(game.score,prev.score):game.score,stars:Math.max(stars,prev?prev.stars:0)};
  }
  const nextLockedBefore=!isDaily&&game.siteIdx<SITES.length-1&&!unlocked(game.siteIdx+1);
  save.credits+=credits;
  const S=save.stats; S.shifts++; S.pallets+=st.recv; S.orders+=st.shipOn+st.shipLate; S.rush+=st.rushOn; if(stars===3)S.threeStars++; S.bestScore=Math.max(S.bestScore,game.score);
  const xpGain=Math.max(0,game.score)+stars*40+(isDaily?50:0);
  const lv=addXp(xpGain);
  // achievements
  unlock('first');
  if(stars===3)unlock('three');
  if(game.score>=1000)unlock('score1k');
  if(st.shipOn>=10&&st.lateOrders===0)unlock('nolate');
  if(st.recv>=50)unlock('pallets50');
  if(st.fast>=5)unlock('fast5');
  if(st.rushOn>=5)unlock('rush5');
  if(stars>=2&&st.spent===0)unlock('thrifty');
  if(st.fixes>=5)unlock('fixer');
  if(SITES.every(s=>save.best[s.code]&&save.best[s.code].stars>=2))unlock('allsites');
  if(save.best['WH-05']&&save.best['WH-05'].stars===3)unlock('summit');
  if(dailyRes&&dailyRes.cleared)unlock('daily1');
  if(streakNow()>=3)unlock('streak3'); if(streakNow()>=7)unlock('streak7');
  const newUnlock=nextLockedBefore&&unlocked(game.siteIdx+1)?SITES[game.siteIdx+1]:null;
  writeSave();
  game.lastReport={score:game.score,stars,met,otr,n,credits,xpGain,xpBefore,xpAfter:save.xp,levelBefore,levelAfter:lv.after,newUnlock,daily:dailyRes,mode:game.mode,
    st:Object.assign({},st),ledger:Object.assign({},game.ledger),bestCombo:game.bestCombo,ach:game.newAch.slice()};
  game.incident=null; game.queue=[]; renderIncident();
  log('Shift over · score '+game.score,'ok');
  RNG=Math.random;
  openModal('report');
  setTimeout(()=>{for(let i=0;i<stars;i++)setTimeout(()=>Snd.play('star',i),i*350);},200);
  if(stars>=2||(dailyRes&&dailyRes.newClear))setTimeout(()=>confetti(160),700);
}

  const s=slots.find(x=>x.pallet===g); if(s)return {st:'Stored',cls:'ok',loc:site.code+' · rack '+s.id};
  const st=staging.find(x=>x.pallet===g); if(st)return {st:'Staged',cls:'info',loc:site.code+' · outbound staging'+(st.order?' · '+st.order.id:'')};
  const f=forklifts.find(x=>x.carry===g); if(f)return {st:'Moving',cls:'warn',loc:'On the forks of '+f.id};
  return {st:'Bulk',cls:'',loc:site.code+' · bulk floor'};
}
function selLabel(s){
  if(s.kind==='tk')return esc(s.id)+'<small>'+esc(truckStatus(s)[0])+'</small>';
  if(s.kind==='fl')return esc(s.id)+'<small>'+esc(s.broken?'Broken down':s.task?s.task.type:'Idle')+'</small>';
  if(s.kind==='bay'||s.kind==='lbay')return 'Bay '+(s.bay.i+1)+'<small>'+(s.bay.truck?esc(truckStatus(s.bay.truck)[0]):'Free')+'</small>';
  if(s.kind==='lfl')return esc(s.id)+'<small>'+esc(s.task)+'</small>';
  if(s.kind==='van')return esc(s.id)+'<small>'+esc(s.state)+'</small>';
  if(s.kind==='dest'){const t=s.t;return esc(t.type==='cshop'?t.shop.name:t.type==='chouse'?t.addr:t.name)+'<small>'+(t.type==='chouse'?'Home':'Shop')+'</small>';}
  if(s.kind==='site')return esc(SITES[s.idx].code)+'<small>'+esc(SITES[s.idx].name)+'</small>';
  if(s.kind==='chg')return 'C'+(s.i+1)+'<small>'+(chgActive(s)?'Charging':'Free')+'</small>';
  if(s.kind==='pal')return esc(s.g.userData.meta.id)+'<small>'+esc(SKUS[s.g.userData.sku].name)+'</small>';
  return '';
}

function pickAt(x,y){

let perf=0,last=performance.now(),hudT=0,slowT=0;
const tmpV=new THREE.Vector3();
function tick(now){

function tickBody(now){
  let rdt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; if(document.hidden)rdt=0; perf+=rdt;
  const dt=rdt*sim.speed;
  if(dt>0){
    sim.sec+=dt;
    const surge=game.surgeUntil>sim.sec;
    sim.nextOrder-=dt*(surge?2:1);
    if(sim.nextOrder<=0){ releaseOrder(); sim.nextOrder=rand(site.orderRate[0],site.orderRate[1])*(game.mods.has('calm')?0.77:1); }
    sim.nextTruck-=dt;
    if(sim.nextTruck<=0){ if(sim.enroute.length<3) scheduleTruck(irand(8,20),false); sim.nextTruck=rand(site.truckRate[0],site.truckRate[1]); }
    for(let i=0;i<sim.enroute.length;i++){
      const sh=sim.enroute[i]; if(clockMin()<sh.eta)continue;
      if(trucks.filter(t=>t.state==='queued').length>=4)break;
      sim.enroute.splice(i,1); i--; spawnTruck(sh,null); log(sh.id+' '+sh.car.name+' arrived at the gate',''); if(Math.random()<.35)Snd.play('horn');
    }
    dispatchQueue();
    trucks.slice().forEach(t=>updateTruck(t,dt));
    lites.forEach(Lt=>{updateLite(Lt,dt);liteXferTick(Lt,dt);}); updateXfers(dt);
    forklifts.forEach(f=>updateForklift(f,dt));
    for(let i=forklifts.length-1;i>=0;i--){const f=forklifts[i];if(f.remove){world.remove(f.g);forklifts.splice(i,1);if(selected===f)select(null);}}
    staging.forEach(s=>{if(!s.pallet)return;s.t+=dt;
      if(s.t>6){s.pallet.scale.setScalar(Math.max(.001,1-(s.t-6)/0.8));
        if(s.t>6.8){world.remove(s.pallet);s.pallet=null;sim.shipped++;const o=s.order;s.order=null;queueDelivery(o);log((o?o.id:'Order')+' loaded out and shipped'+(o&&o.stagedAt>o.due?' (late)':''),o&&o.stagedAt>o.due?'warn':'ok');}}});
    slowT+=dt;
    if(slowT>=1){slowT=0;lateCheck();clearSpills();
      if(game.phase==='shift'){
        game.nextEvent-=1; if(game.nextEvent<=0){rollEvent();game.nextEvent=rand(site.eventRate[0],site.eventRate[1]);}
        SKU_KEYS.forEach(checkLow);
        if(sim.sec>=SHIFT_LEN) endShift();
      }}
    tickReqs(sim.speed?rdt:0);
    if(game.incident&&!tut){
      game.incident.t+=rdt;
      const tm=$('#incTimer'); if(tm) tm.style.width=Math.max(0,100-game.incident.t/game.incident.ttl*100)+'%';
      if(game.incident.t>=game.incident.ttl) chooseIncident(game.incident.def||0);
    }
  }
  tutTick();
  bays.forEach(b=>{
    const want=b.truck&&(b.truck.state==='unloading'||(b.truck.state==='docking'&&b.truck.x<9))?1:0;
    b.open+=clamp(want-b.open,-rdt*0.9,rdt*0.9);
    const s=1-0.88*b.open; b.door.scale.y=s; b.door.position.y=3.85-3.6*s/2;
    const c=b.truck?(b.truck.state==='unloading'?'#e0564b':'#f0a623'):'#24b46e';
    b.lightMat.color.set(c);b.lightMat.emissive.set(c);
  });
  ghosts.forEach(g=>{const on=g.userData.build===buildSel;g.userData.mat.opacity=on?.38:.14+.08*Math.sin(perf*3);g.children[2].position.y=g.children[2].userData.y0==null?(g.children[2].userData.y0=g.children[2].position.y):g.children[2].userData.y0+Math.sin(perf*3)*.12;});
  const e=1-Math.pow(0.0015,rdt||0.016);
  if(game.fly){view.target.lerp(view.targetT,1-Math.pow(0.12,rdt||0.016));
    if(Math.abs(view.target.x-game.fly.x)<4){const f=game.fly;game.fly=null;if(f.activate&&f.i!==game.siteIdx)freePlay(f.i);else{view.zoomT=innerWidth<=760?1.15:1;dirty=true;}}}
  else view.target.lerp(view.targetT,e); view.az+=(view.azT-view.az)*e; view.zoom+=(view.zoomT-view.zoom)*e;
  placeCam();
  let ringObj=null;
  if(!selected&&tut&&TUT[tut.i]&&TUT[tut.i].hint3d){ringObj=trucks.find(t=>t.state==='unloading')||trucks[0];}
  ring.visible=!!ringObj;
  if(ringObj){ring.position.set(ringObj.x+OX,0.08,ringObj.z);const pulse=1+0.12*Math.sin(perf*5);ring.scale.set(6.4*pulse,2.2*pulse,1);ring.rotation.z=ringObj.yaw;}
  if(selected&&selected.kind==='pal'&&!selected.g.parent)select(null);
  if(selected){
    const p=selPos(selected);
    brk.position.set(p.x,p.y,p.z); brk.rotation.y=p.yaw;
    if(game.follow===selected) view.targetT.set(p.x,0,p.z);
    routeT+=rdt; if(routeT>0.3){routeT=0;rebuildRoute();}
    tmpV.set(p.x,p.y+p.h,p.z).project(cam);
    const tg=$('#tag3d'); tg.hidden=false;
    tg.style.transform='translate('+((tmpV.x+1)/2*innerWidth)+'px,'+((1-tmpV.y)/2*innerHeight-8)+'px) translate(-50%,-100%)';
    tg.innerHTML=selLabel(selected);
  }
  route.children.forEach(c=>{if(c.userData.head)c.userData.head.forEach(m=>m.position.y=m.userData.y0+Math.sin(perf*3)*.12);});
  staging.forEach(st=>{if(!st.pin)return;st.pin.visible=!!st.pallet;if(st.pallet)st.pin.userData.head.forEach(m=>m.position.y=m.userData.y0+Math.sin(perf*3+st.x)*.1);});
  barriers.forEach(b=>{const tn=t=>Math.hypot(wx(t)-21.6-b.ox,t.z-b.pz)<9.5;const near=b.kind==='tk'?(trucks.some(tn)||liteTrucks.some(tn)):vans.some(v=>Math.hypot(v.x-12-b.ox,v.z-b.pz)<5.5);b.open+=clamp((near?1:0)-b.open,-rdt*1.6,rdt*1.6);b.arm.rotation.z=b.dir*b.open*1.35;});
  if(town.pins){const pv=view.zoom<0.4,ps=Math.min(3,0.13/view.zoom)*46;town.pins.forEach(p=>{p.visible=pv&&!game.town;p.scale.set(ps,ps*140/640,1);});}
  if(shell.g){const tgt=(view.zoom<0.8||game.town)?1:0;shell.op+=(tgt-shell.op)*Math.min(1,rdt*4);const o=shell.op;shell.mats.forEach(m=>{m.opacity=o;m.depthWrite=o>0.98;});shell.g.visible=o>0.03;}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=rdt;
    if(p.t>1.5){p.el.remove();pops.splice(i,1);continue;}
    tmpV.copy(p.p).project(cam);
    p.el.style.transform='translate('+((tmpV.x+1)/2*innerWidth)+'px,'+((1-tmpV.y)/2*innerHeight-p.t*34)+'px) translate(-50%,-100%)';
    p.el.style.opacity=String(p.t<1?1:1-(p.t-1)/.5);}
  updateCars(rdt*(sim.speed?Math.min(sim.speed,2):0.5)); updateVans(dt); if(dt>0)townAccrue(dt); updateTownHover();
  stepConfetti(rdt);
  Snd.music();
  renderer.render(scene,cam);
  $('#clock').textContent=fmtT(clockMin());
  hudT+=rdt;
  if(hudT>0.4||dirty){hudT=0;dirty=false;renderKpis();renderShift();renderPanel();renderTrack();renderInspector();renderActs();renderMissions();}
}

/* ---------------- boot ---------------- */
function boot(){
  const unlockedIdx=SITES.map((_,i)=>i).filter(unlocked);
  game.menuSel=unlockedIdx[unlockedIdx.length-1]||0;
  $('#loading').remove(); $('#hud').hidden=false;
  loadSite(game.menuSel);
  addEventListener('resize',resize);
  setSpeed(1); renderIncident(); syncSoundBtn();
  game.menuTab=save.daily.last!==todayKey()&&save.tutorial&&save.stats.shifts>0?'daily':'play';
  welcomeBack(); setInterval(writeSave,20000); document.addEventListener('visibilitychange',writeSave);
  openModal('menu');
  setTimeout(hideHint,14000);
  requestAnimationFrame(t=>{last=t;tick(t);});
}
const fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('800 40px "Bricolage Grotesque"'),document.fonts.load('italic 800 40px "Bricolage Grotesque"'),document.fonts.load('600 20px Figtree')]).catch(()=>{}):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,1800))]).then(boot);
})();
</script>
